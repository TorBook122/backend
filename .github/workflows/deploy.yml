# Backend deploy is handled by Railway (not this workflow).
#
# Flow (this phase):
# - backend_staging → Railway Staging: autodeploy ON, Wait for CI ON
# - main → CI + e2e only; Railway Production autodeploy OFF (deferred)
#
# CI (ci.yml) runs on push/PR to backend_devlope, backend_staging, main.
# E2E (e2e.yml) is soft on PRs to backend_devlope; required on staging/main.
# After merge to backend_staging, Railway waits for CI green before deploying.

name: Deploy

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Railway deploy reminder
        run: |
          echo "backend_staging: CI + e2e → Railway Staging (Wait for CI, autodeploy ON)"
          echo "main: CI + e2e only — Railway Production deploy deferred"
          echo "See docs/GIT_WORKFLOW.md for branch flow and dashboard checklist"
