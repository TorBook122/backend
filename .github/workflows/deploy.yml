# Backend deploy is handled by Railway (not this workflow).
#
# Flow:
# - backend_staging → Railway Staging: autodeploy OFF — manual deploy after merge
# - main → Railway Production: autodeploy ON, Wait for CI ON
#
# CI (ci.yml) runs on push/PR to backend_devlope, backend_staging, main.
# E2E (e2e.yml) is soft on PRs to backend_devlope; required on staging/main.
# After merge to backend_staging, run deploy manually on Railway once CI is green.
# After merge to main, Railway auto-deploys when CI passes.

name: Deploy

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Railway deploy reminder
        run: |
          echo "backend_staging: CI + e2e → manual Railway Staging deploy (autodeploy OFF)"
          echo "main: CI + e2e → Railway Production auto-deploy (Wait for CI ON)"
          echo "See docs/GIT_WORKFLOW.md for branch flow and dashboard checklist"
